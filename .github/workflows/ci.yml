# CI de TutorFlow (FABRICA.md §5.2). Los jobs bloqueantes no usan continue-on-error.
# Unica excepcion: evals-llm (T-10), NO bloqueante, solo por workflow_dispatch y solo si existe el secreto LLM_API_KEY.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      combinacion:
        description: "Combinacion de evals [eval] (gasta cuota del proveedor): a = flash-lite + full-context, b = flash-lite + bm25, c = 3.8-flash + full-context"
        type: choice
        options: ["a", "b", "c"]
        default: "a"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4.3.1
        with:
          global-json-file: global.json
      - name: Compilar (warnings como errores)
        run: dotnet build TutorFlow.sln -warnaserror
      - name: Pruebas [dom] [app] [api]
        run: dotnet test TutorFlow.sln --no-build

  retrieval:
    name: retrieval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4.3.1
        with:
          global-json-file: global.json
      - name: Evals [ret] con los umbrales de SPEC 7.6 (sin LLM, sin llaves)
        run: dotnet run --project evals/TutorFlow.Evals -- ret --json-out evals/runs/ret-ci.json
      - name: Publicar el resultado crudo
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ret
          path: evals/runs/ret-ci.json
          if-no-files-found: ignore

  mutantes:
    name: mutantes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_PR: ${{ github.event.pull_request.base.sha }}
      HEAD_PR: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Decidir si aplica (FABRICA 5.2)
        id: cambios
        run: |
          # En push a main siempre; en PR solo si cambian Domain, Application o Infrastructure/{Retrieval,Llm}.
          if [ -z "$BASE_PR" ]; then
            echo "aplica=true" >> "$GITHUB_OUTPUT"
            echo "push a main: los mutantes corren siempre"
          elif git diff --name-only "$BASE_PR...$HEAD_PR" | grep -Eq '^src/(TutorFlow\.Domain/|TutorFlow\.Application/|TutorFlow\.Infrastructure/(Retrieval|Llm)/)'; then
            echo "aplica=true" >> "$GITHUB_OUTPUT"
            echo "el PR toca codigo cubierto por mutantes"
          else
            echo "aplica=false" >> "$GITHUB_OUTPUT"
            echo "el PR no toca Domain, Application ni Infrastructure/{Retrieval,Llm}: mutantes omitidos"
          fi
      - uses: actions/setup-node@v4.4.0
        if: steps.cambios.outputs.aplica == 'true'
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v4.3.1
        if: steps.cambios.outputs.aplica == 'true'
        with:
          global-json-file: global.json
      - name: Mutantes (M1-M16 aplicables; PENDIENTE no cuenta como aprobado)
        if: steps.cambios.outputs.aplica == 'true'
        run: node scripts/mutantes/mutantes.js --json mutantes.json
      - name: Publicar el resultado
        if: always() && steps.cambios.outputs.aplica == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mutantes
          path: mutantes.json
          if-no-files-found: ignore

  trazabilidad:
    name: trazabilidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Matriz de trazabilidad (tareas integradas)
        run: node scripts/trazabilidad/trazabilidad.js --json trazabilidad.json
      - name: Publicar la matriz
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trazabilidad
          path: trazabilidad.json
          if-no-files-found: ignore

  secretos:
    name: secretos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Version e imagen fijadas (tag + digest).
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: gitleaks sobre la historia completa
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  lights-out:
    name: lights-out
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_PR: ${{ github.event.pull_request.base.sha }}
      HEAD_PR: ${{ github.event.pull_request.head.sha }}
      BEFORE_PUSH: ${{ github.event.before }}
      SHA_PUSH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Trailer Generado-por en commits que tocan codigo (AGENTS.md §9.4)
        run: |
          if [ -n "$BASE_PR" ]; then
            RANGO="$BASE_PR..$HEAD_PR"
          elif [ -z "$BEFORE_PUSH" ] || [ "$BEFORE_PUSH" = "0000000000000000000000000000000000000000" ]; then
            RANGO="$SHA_PUSH"
          else
            RANGO="$BEFORE_PUSH..$SHA_PUSH"
          fi
          echo "Rango evaluado: $RANGO"
          node scripts/lights-out/verificar.js --rango "$RANGO"

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Smoke en contenedor (RES-01.b, RES-03.a, RES-03.b; sin llave del proveedor)
        run: bash scripts/smoke/smoke.sh
      - name: Apagar compose (siempre)
        if: always()
        run: docker compose -p tutorflow-smoke -f docker-compose.yml -f scripts/smoke/compose.sin-llave.yml down -v --remove-orphans

  # Propiedad de rutas (FABRICA 5.2, T-12): cada commit con 'Agente: X' solo toca las rutas de X (scripts/propiedad/rutas.json).
  propiedad:
    name: propiedad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_PR: ${{ github.event.pull_request.base.sha }}
      HEAD_PR: ${{ github.event.pull_request.head.sha }}
      BEFORE_PUSH: ${{ github.event.before }}
      SHA_PUSH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
      - name: Autoprueba del verificador (casos rojos y verdes sobre un repo temporal)
        run: node scripts/propiedad/verificar.js --autoprueba
      - name: Rutas por Agente en los commits del rango
        run: |
          if [ -n "$BASE_PR" ]; then
            RANGO="$BASE_PR..$HEAD_PR"
          elif [ -z "$BEFORE_PUSH" ] || [ "$BEFORE_PUSH" = "0000000000000000000000000000000000000000" ]; then
            RANGO="$SHA_PUSH"
          else
            RANGO="$BEFORE_PUSH..$SHA_PUSH"
          fi
          echo "Rango evaluado: $RANGO"
          node scripts/propiedad/verificar.js --rango "$RANGO"

  # Interfaz web (SPEC-WEB, FABRICA 5.2). Bloqueante cuando corre: en PR solo si el PR toca web/**; en main siempre que exista web/.
  # Mientras web/package.json no exista (T-13 sin integrar) los pasos se omiten y lo dicen: no es un verde por haber probado algo.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_PR: ${{ github.event.pull_request.base.sha }}
      HEAD_PR: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Decidir si aplica
        id: cambios
        run: |
          if [ ! -f web/package.json ]; then
            echo "aplica=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/ no existe aun (web/package.json ausente): el job web NO ejecuto nada. No es una verificacion de la web."
          elif [ -n "$BASE_PR" ] && ! git diff --name-only "$BASE_PR...$HEAD_PR" | grep -Eq '^(web/|scripts/web/)'; then
            echo "aplica=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca web/**: el job web se omite."
          else
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4.4.0
        if: steps.cambios.outputs.aplica == 'true'
        with:
          node-version: "22.12.0"
      - name: npm ci
        if: steps.cambios.outputs.aplica == 'true'
        working-directory: web
        run: npm ci
      - name: tsc --noEmit (strict)
        if: steps.cambios.outputs.aplica == 'true'
        working-directory: web
        run: npx tsc --noEmit
      - name: Pruebas [web] (Vitest, axe en jsdom)
        if: steps.cambios.outputs.aplica == 'true'
        working-directory: web
        run: npm test
      - name: vite build
        if: steps.cambios.outputs.aplica == 'true'
        working-directory: web
        run: npm run build

  # Playwright [e2e] contra el servicio web + API SIN llave (override de T-07b). Nunca usa secretos ni consume cuota del LLM.
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_PR: ${{ github.event.pull_request.base.sha }}
      HEAD_PR: ${{ github.event.pull_request.head.sha }}
      PROYECTO: tutorflow-web-e2e
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Decidir si aplica
        id: cambios
        run: |
          if [ ! -f web/package.json ] || [ ! -f web/Dockerfile ]; then
            echo "aplica=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/ no existe aun (falta web/package.json o web/Dockerfile): el job web-e2e NO ejecuto nada. No es una verificacion de la web."
          elif [ -n "$BASE_PR" ] && ! git diff --name-only "$BASE_PR...$HEAD_PR" | grep -Eq '^(web/|scripts/web/|docker-compose\.yml|src/|Dockerfile)'; then
            echo "aplica=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El PR no toca web/**, compose ni la API: el job web-e2e se omite."
          else
            echo "aplica=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Levantar API sin llave + servicio web (perfil web, override de T-07b)
        if: steps.cambios.outputs.aplica == 'true'
        run: docker compose -p "$PROYECTO" -f docker-compose.yml -f scripts/smoke/compose.sin-llave.yml --profile web up -d --build --wait
      - name: Playwright [e2e] (imagen oficial fijada, scripts/web/compose.yml)
        if: steps.cambios.outputs.aplica == 'true'
        run: docker compose -f scripts/web/compose.yml run --rm playwright sh -c "npm ci && npx playwright test"
      - name: Publicar informe y trazas de Playwright
        if: always() && steps.cambios.outputs.aplica == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: web-e2e
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Logs de los servicios si fallo
        if: failure() && steps.cambios.outputs.aplica == 'true'
        run: docker compose -p "$PROYECTO" -f docker-compose.yml -f scripts/smoke/compose.sin-llave.yml --profile web logs --no-color --tail 80
      - name: Apagar compose (siempre)
        if: always() && steps.cambios.outputs.aplica == 'true'
        run: docker compose -p "$PROYECTO" -f docker-compose.yml -f scripts/smoke/compose.sin-llave.yml --profile web down -v --remove-orphans

  # NO bloqueante (FABRICA.md §5.2): llama al LLM real. Solo por ejecucion manual y se omite limpiamente sin el secreto LLM_API_KEY.
  evals-llm:
    name: evals-llm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      COMBINACION: ${{ inputs.combinacion }}
    steps:
      - name: Comprobar el secreto LLM_API_KEY
        id: llave
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existe el secreto LLM_API_KEY: evals-llm se omite (no es un fallo)."
          fi
      - uses: actions/checkout@v4.2.2
        if: steps.llave.outputs.disponible == 'true'
      - uses: actions/setup-dotnet@v4.3.1
        if: steps.llave.outputs.disponible == 'true'
        with:
          global-json-file: global.json
      - name: Bateria [eval] con el LLM real (combinacion elegida)
        if: steps.llave.outputs.disponible == 'true'
        env:
          EVAL_CI: "1"
          EVAL_RUNNER: host
        run: bash evals/correr-eval.sh "$COMBINACION" --pausa-ms 6000
      - name: Publicar el crudo (sin llave ni cabeceras)
        if: always() && steps.llave.outputs.disponible == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: evals-llm-${{ inputs.combinacion }}
          path: evals/runs/eval-*.json
          if-no-files-found: ignore
