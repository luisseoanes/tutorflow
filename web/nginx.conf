# Servidor estático de TutorFlow Web (SPEC-WEB §9).
# - Sirve el bundle en :3000.
# - Proxy de /api/* a tutorflow:8080 (mismo origen; sin CORS; el contrato HTTP no cambia).
# - Cabeceras de seguridad: CSP estricta (sin 'unsafe-inline' en scripts ni estilos), nosniff, no-referrer.
server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Las cabeceras viven solo a nivel de server (los location no declaran add_header: no hay herencia que perder).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Resolución diferida del upstream: nginx arranca aunque tutorflow aún no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $upstream http://tutorflow:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Las respuestas del LLM pueden tardar; el cliente web cancela a los 60 s.
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        client_max_body_size 128k;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
