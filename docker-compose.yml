# TutorFlow: `cp .env.example .env && docker compose up -d` (8080 publicado; la API simulada solo en la red interna).
name: tutorflow

services:
  mock-api:
    image: node:20-alpine
    working_dir: /mock-api
    command: ["node", "server.js"]
    volumes:
      - ./q10/material/mock-api:/mock-api:ro
    # Sin 'ports': el puerto 4000 solo existe dentro de la red de compose.
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/salud"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  tutorflow:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      MOCK_API_BASE_URL: http://mock-api:4000
      KNOWLEDGE_PATH: /app/knowledge
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./q10/material/reglamento:/app/knowledge:ro
    depends_on:
      mock-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/salud"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Interfaz web (SPEC-WEB §9, T-12). El Dockerfile y la configuracion del servidor estatico son de Core (web/**, T-13):
  # build con Node -> servidor estatico que sirve el bundle, hace proxy de /api/* a tutorflow:8080 (mismo origen, sin CORS) y fija
  # CSP estricta, X-Content-Type-Options: nosniff y Referrer-Policy: no-referrer. El contenedor escucha en 3000. Sin secretos.
  # Perfil 'web': mientras web/ no exista (T-13 sin integrar) 'docker compose up' sin perfil no lo toca y no falla.
  # Uso: docker compose --profile web up -d   (o COMPOSE_PROFILES=web). Al integrar T-13 se valorara quitar el perfil.
  web:
    profiles: ["web"]
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      tutorflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
