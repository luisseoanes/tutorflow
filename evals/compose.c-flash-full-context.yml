# Combinacion (c) de evals: gemini-3.8-flash + full-context. T-10, INT-013. Ver compose.a-... para las notas de secretos.
# Precios USD por millon de tokens (0.75 entrada / 3.75 salida, vigentes hasta 2026-12-31):
# https://ai.google.dev/gemini-api/docs/pricing (consultada 2026-11-25).
services:
  tutorflow:
    env_file:
      - path: ${TUTORFLOW_ENV_FILE:-./.env}
        required: false
    environment:
      LLM_MODEL: "gemini-3.8-flash"
      RETRIEVAL_STRATEGY: "full-context"
      LLM_PRICE_INPUT_PER_MTOK: "0.75"
      LLM_PRICE_OUTPUT_PER_MTOK: "3.75"
